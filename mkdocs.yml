site_name: DoDomuDojade - Dokumentacja
docs_dir: resources/docs
site_dir: site
site_url: https://sloths4.github.io/DoDomuDojade/
use_directory_urls: true

theme:
  name: material
  locale: en
  palette:
    scheme: dark
  features:
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

nav:
  - Home: index.md
  - Architektura: architecture.md
  - API i routing: api.md
  - Model danych: data-model.md
  - Konfiguracja: configuration.md
  - Integracje: integrations.md
  - Display: display.md
  - Panel: panel.md
  - Rozwój: development.md
  - Stan projektu: current-state.md
  - Migracja na Pythona: python-migration.md

